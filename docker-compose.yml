name: pp_light
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # No AUTH_URL: Auth.js takes scheme and host from Caddy's forwarded headers, so HTTP and HTTPS both work.
      # Links in mails use the address from the setup (Einstellungen → Server).
    # No published port: only Caddy talks to the app.
    expose:
      - "3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      start_period: 30s
      retries: 24
  worker:
    build: .
    restart: unless-stopped
    command: ["worker"]
    env_file: .env
    environment:
      # Mail goes to the SMTP server configured in .env (SMTP_HOST, SMTP_PORT, …).
      # No Mailpit here: it would expose reset and invitation links without authentication.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      app:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PP_DOMAIN: ${PP_DOMAIN:?PP_DOMAIN in .env setzen}
      PP_TLS: ${PP_TLS:-internal}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
  uploads:
  # Caddy's certificates and its local CA – keep it, or clients must trust a new root certificate.
  caddy_data:
  caddy_config:
