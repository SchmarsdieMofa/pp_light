name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://pp:pp@localhost:5432/pp_light
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      AUTH_TRUST_HOST: "true"
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres and Mailpit
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres mailpit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
